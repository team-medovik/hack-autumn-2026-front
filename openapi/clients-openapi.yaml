openapi: 3.1.0
info:
  title: API Hack Autumn 2026 — клиенты
  version: v1
  description: |
    Сводная таблица клиентов и карточка клиента по последнему снимку биллинга. Сводка главного экрана — в dashboard-openapi.yaml.

    Соглашения:
    - суммы — в евро, числом с двумя знаками после запятой (BigDecimal → number);
    - даты — ISO 8601 с часовым поясом, даты без времени — `2026-10-21`;
    - enum'ы — в нижнем регистре (в Java: `@JsonValue` на enum'е);
    - нет снимков — это не ошибка: 200 и пустой список.
servers:
  - url: http://localhost:33000
tags:
  - name: Клиенты
    description: Сводная таблица с фильтром, поиском, сортировкой и пагинацией; карточка клиента.

paths:
  /api/v1/clients:
    get:
      tags: [Клиенты]
      operationId: listClients
      summary: Страница сводной таблицы клиентов
      description: |
        Клиенты последнего снимка. Фильтр, поиск, сортировка и пагинация — на сервере.

        - `search` ищет подстроку в email или ID **по всем клиентам**: с ним `level` не применяется;
        - при сортировке по `score` клиенты без оценки (`score: null`) всегда в конце;
        - `page` больше последней страницы — отдаётся последняя (в ответе её номер);
        - снимков ещё нет — это не ошибка: 200, пустые `items` и нули в `levelCounts`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ListLevel'
        - $ref: '#/components/parameters/ListSearch'
        - $ref: '#/components/parameters/ListSort'
        - $ref: '#/components/parameters/ListOrder'
        - name: page
          in: query
          description: Номер страницы, с 1.
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 12
      responses:
        '200':
          description: Страница получена (в том числе когда снимков ещё нет)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientsResponse'
              examples:
                firstPage:
                  $ref: '#/components/examples/ClientsFirstPage'
                noSnapshot:
                  $ref: '#/components/examples/ClientsWithoutSnapshot'
        '401':
          description: Access-токен отсутствует, истёк или некорректен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/clients/{id}:
    get:
      tags: [Клиенты]
      operationId: getClientCard
      summary: Карточка клиента
      description: |
        Всё для окна «Карточка клиента» одним запросом: score и его факторы, деньги,
        услуги и разбор потери в месяц («Как посчитано»).

        - нет оценки (`score: null`) — пустые `factors`, `balance.required: null`,
          `lossBreakdown.items` пуст, `monthlyLoss: 0`;
        - услуги отдаются плоским списком — фронт группирует их по `status`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Карточка получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCard'
              examples:
                highRisk:
                  $ref: '#/components/examples/ClientCardHighRisk'
                noScore:
                  $ref: '#/components/examples/ClientCardNoScore'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ClientNotFound'

  /api/v1/clients/{id}/position:
    get:
      tags: [Клиенты]
      operationId: getClientPosition
      summary: Место клиента в сводной таблице и его соседи
      description: |
        Для «Предыдущий · 2 из 42 · Следующий» в карточке. Параметры — те же, что у списка
        (без пагинации): соседи считаются в том же порядке, что строки таблицы.

        Клиента нет в списке с этими параметрами (например, открыли по ссылке с другим
        фильтром) — это не ошибка: 200 и `index: null`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ListLevel'
        - $ref: '#/components/parameters/ListSearch'
        - $ref: '#/components/parameters/ListSort'
        - $ref: '#/components/parameters/ListOrder'
      responses:
        '200':
          description: Позиция получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPosition'
              example: { index: 2, total: 42, prevId: '1321245', nextId: '242323' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ClientNotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ClientId:
      name: id
      in: path
      required: true
      description: ID клиента в биллинге.
      schema:
        type: string
        example: '1321746'
    ListLevel:
      name: level
      in: query
      description: Уровень риска. Без параметра — все уровни.
      schema:
        $ref: '#/components/schemas/RiskLevel'
    ListSearch:
      name: search
      in: query
      description: Подстрока email или ID, без учёта регистра. С ней `level` не применяется.
      schema:
        type: string
        example: client5
    ListSort:
      name: sort
      in: query
      schema:
        $ref: '#/components/schemas/ClientSortField'
    ListOrder:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc

  responses:
    Unauthorized:
      description: Access-токен отсутствует, истёк или некорректен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ClientNotFound:
      description: Клиента с таким ID нет в последнем снимке
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

  schemas:
    RiskLevel:
      type: string
      description: |
        Уровень риска не продлить услуги. `none` — score не считается: живых услуг не осталось,
        все удалены или заблокированы.
      enum: [high, medium, low, none]

    ScoreFactor:
      type: object
      required: [id, label, points]
      properties:
        id:
          type: string
          example: awaiting-payment
        label:
          type: string
          description: Фактор, готовый к показу.
          example: Ожидает оплаты, удалят завтра
        points:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Сколько баллов score дал фактор («+70», «+13,8»). Сумма по факторам — score.
          example: 70

    ClientSortField:
      type: string
      description: Поле сортировки сводной таблицы.
      enum: [score, id, email, balance, topUp, monthlyLoss]
      default: score

    ClientListItem:
      type: object
      description: Строка сводной таблицы.
      required: [id, email, score, level, reason, balance, topUp, monthlyLoss]
      properties:
        id:
          type: string
          example: '1321245'
        email:
          type: string
          format: email
          example: client5@mail.ru
        score:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: Score 0–100, `null` — нет оценки.
          example: 100
        level:
          $ref: '#/components/schemas/RiskLevel'
        reason:
          type: [string, 'null']
          description: Главная причина риска, человекочитаемо. `null` — причины нет (нет оценки).
          example: Ожидает оплаты, удалят завтра
        balance:
          type: number
          description: Сейчас на счёте, €.
          example: 0
        topUp:
          type: number
          description: Пополнено за всё время, €.
          example: 312.4
        monthlyLoss:
          type: number
          description: Потеря в месяц, если клиент уйдёт, €.
          example: 28.8

    ClientsResponse:
      type: object
      required: [items, page, pageSize, total, levelCounts]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientListItem'
        page:
          type: integer
          format: int32
          description: Номер отданной страницы, с 1.
        pageSize:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
          description: Найдено по фильтру или поиску — для пагинации.
        levelCounts:
          type: object
          description: |
            Клиентов в снимке по уровням — для счётчиков фильтров. Не зависят от фильтра и поиска.
            Все нули — снимков ещё не загружали.
          required: [high, medium, low, none]
          properties:
            high: { type: integer, format: int32 }
            medium: { type: integer, format: int32 }
            low: { type: integer, format: int32 }
            none: { type: integer, format: int32 }

    ClientCard:
      type: object
      required: [id, email, score, level, factors, balance, services, lossBreakdown]
      properties:
        id:
          type: string
          example: '1321746'
        email:
          type: string
          format: email
          example: client17@mail.ru
        score:
          type: [number, 'null']
          format: double
          minimum: 0
          maximum: 100
          description: Score 0–100. `null` — нет оценки.
          example: 94.2
        level:
          $ref: '#/components/schemas/RiskLevel'
        factors:
          type: array
          description: Из чего сложился score, по убыванию `points`. Пусто — нет оценки.
          items:
            $ref: '#/components/schemas/ScoreFactor'
        balance:
          $ref: '#/components/schemas/ClientCardBalance'
        services:
          type: array
          description: Все услуги клиента, в том числе удалённые и заблокированные.
          items:
            $ref: '#/components/schemas/ClientService'
        lossBreakdown:
          $ref: '#/components/schemas/LossBreakdown'

    ClientCardBalance:
      type: object
      description: «Не хватает» фронт считает сам — `max(0, required − available)`.
      required: [available, required, monthlyLoss]
      properties:
        available:
          type: number
          format: double
          description: Сейчас на счёте.
          example: 6.48
        required:
          type: [number, 'null']
          format: double
          description: Нужно на продления в ближайшие дни. `null` — продлевать нечего.
          example: 9.9
        monthlyLoss:
          type: number
          format: double
          description: Потеря в месяц, если клиент уйдёт. Совпадает с `monthlyLoss` в списке.
          example: 6.77

    ServiceStatus:
      type: string
      description: |
        Статус услуги — группа в карточке. Порядок групп на экране — как в enum.
      enum: [awaiting_payment, active, disabled_by_client, deleted, blocked]

    ServiceEventType:
      type: string
      description: |
        Будущие события: `renew` — продлится, `expire` — истечёт, `delete` — удалят.
        Прошедшие: `deleted` — удалена, `blocked` — заблокирована.
      enum: [renew, expire, delete, deleted, blocked]

    ClientService:
      type: object
      required: [id, name, score, level, status, monthlyPrice, event, autoRenew]
      properties:
        id:
          type: string
          example: service-0017
        name:
          type: string
          example: service-0017
        score:
          type: [number, 'null']
          format: double
          minimum: 0
          maximum: 100
          description: Score услуги. `null` — услуга удалена или заблокирована.
          example: 94.2
        level:
          $ref: '#/components/schemas/RiskLevel'
        status:
          $ref: '#/components/schemas/ServiceStatus'
        monthlyPrice:
          type: [number, 'null']
          format: double
          description: Цена в месяц. `null` — услуга больше не продлевается.
          example: 9.9
        event:
          description: Ближайшее событие живой услуги или последнее — удалённой.
          oneOf:
            - type: object
              required: [type, date]
              properties:
                type:
                  $ref: '#/components/schemas/ServiceEventType'
                date:
                  type: string
                  format: date
                  example: '2026-10-21'
            - type: 'null'
        autoRenew:
          type: [boolean, 'null']
          description: Автопродление. `null` — неприменимо (удалена или заблокирована).
          example: false

    LossBreakdown:
      type: object
      description: |
        Потеря услуги = цена в месяц × риск × (k + (1 − k) × непокрытая доля).
        Сумма `items[].loss` — `balance.monthlyLoss` (с точностью до округления).
      required: [k, uncoveredShare, items]
      properties:
        k:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Доля потери, которая не зависит от баланса.
          example: 0.5
        uncoveredShare:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Какую часть `balance.required` не покрывает `balance.available`.
          example: 0.35
        items:
          type: array
          description: По живым услугам. Пусто — потери нет.
          items:
            $ref: '#/components/schemas/LossBreakdownItem'

    LossBreakdownItem:
      type: object
      required: [serviceId, serviceName, monthlyPrice, risk, loss]
      properties:
        serviceId:
          type: string
          example: service-0017
        serviceName:
          type: string
          example: service-0017
        monthlyPrice:
          type: number
          format: double
          example: 9.9
        risk:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Риск услуги, `score / 100`.
          example: 0.942
        loss:
          type: number
          format: double
          example: 6.27

    ClientPosition:
      type: object
      required: [index, total, prevId, nextId]
      properties:
        index:
          type: [integer, 'null']
          format: int32
          minimum: 1
          description: Номер в списке с 1. `null` — клиента нет в списке с этими параметрами.
          example: 2
        total:
          type: integer
          format: int32
          description: Клиентов в списке.
          example: 42
        prevId:
          type: [string, 'null']
          example: '1321245'
        nextId:
          type: [string, 'null']
          example: '242323'

    ApiErrorResponse:
      type: object
      description: Стандартный формат ошибки API (как в auth).
      properties:
        status:
          type: integer
          format: int32
        error:
          type: string
          example: UNAUTHORIZED
        message:
          type: string
        path:
          type: string
          example: /api/v1/dashboard
        timestamp:
          type: string
          format: date-time

  examples:
    ClientsFirstPage:
      summary: Первая страница по убыванию риска (макет «Сводная таблица»), сокращено до двух строк
      value:
        items:
          - id: '1321245'
            email: client5@mail.ru
            score: 100
            level: high
            reason: Ожидает оплаты, удалят завтра
            balance: 0
            topUp: 312.4
            monthlyLoss: 28.8
          - id: '1321746'
            email: client17@mail.ru
            score: 94.2
            level: high
            reason: Ожидает оплаты, удалят 21.10
            balance: 6.48
            topUp: 148
            monthlyLoss: 6.77
        page: 1
        pageSize: 12
        total: 42
        levelCounts: { high: 13, medium: 14, low: 9, none: 6 }

    ClientsWithoutSnapshot:
      summary: Снимков ещё не загружали (макет «Сводная таблица (без данных)»)
      value:
        items: []
        page: 1
        pageSize: 12
        total: 0
        levelCounts: { high: 0, medium: 0, low: 0, none: 0 }

    ClientCardHighRisk:
      summary: Высокий риск (макет «Карточка клиента»)
      value:
        id: '1321746'
        email: client17@mail.ru
        score: 94.2
        level: high
        factors:
          - id: awaiting-payment
            label: Услуга service-0017 ожидает оплаты, будет удалена 21.10
            points: 70
          - { id: top-up-needed, label: Необходимо пополнить счёт для продления, points: 13.8 }
          - id: shortage
            label: Услуга service-0017 ожидает оплаты, а средств на счёте не хватает
            points: 10.4
        balance: { available: 6.48, required: 9.9, monthlyLoss: 6.77 }
        services:
          - id: service-0017
            name: service-0017
            score: 94.2
            level: high
            status: awaiting_payment
            monthlyPrice: 9.9
            event: { type: delete, date: '2026-10-21' }
            autoRenew: false
          - id: service-0027
            name: service-0027
            score: 15
            level: low
            status: disabled_by_client
            monthlyPrice: 4.95
            event: { type: renew, date: '2026-11-12' }
            autoRenew: true
        lossBreakdown:
          k: 0.5
          uncoveredShare: 0.35
          items:
            - serviceId: service-0017
              serviceName: service-0017
              monthlyPrice: 9.9
              risk: 0.942
              loss: 6.27
            - serviceId: service-0027
              serviceName: service-0027
              monthlyPrice: 4.95
              risk: 0.15
              loss: 0.5

    ClientCardNoScore:
      summary: Без оценки (макет «Карточка клиента (без оценки)»)
      value:
        id: '5101442'
        email: client23@mail.ru
        score: null
        level: none
        factors: []
        balance: { available: 3.2, required: null, monthlyLoss: 0 }
        services:
          - id: service-4421
            name: service-4421
            score: null
            level: none
            status: deleted
            monthlyPrice: null
            event: { type: deleted, date: '2026-09-02' }
            autoRenew: null
        lossBreakdown: { k: 0.5, uncoveredShare: 0, items: [] }
