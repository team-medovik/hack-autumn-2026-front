openapi: 3.1.0
info:
  title: API Hack Autumn 2026 — прочие настройки
  version: v1
  description: |
    Вкладка «Настройки → Другое»: дата расчёта и смена своего пароля. Тема хранится только в
    браузере — API нет.

    Соглашения — как в dashboard-openapi.yaml: даты — ISO 8601; формат ошибок — как в auth.

    Дата расчёта — момент, на который сервер считает score, уровни риска, потери и прогноз.
    По умолчанию — текущее время; для демо и проверки на тестовых данных его фиксируют.
    Смена даты синхронно пересчитывает риски: ответ — после пересчёта, фронт перезапрашивает все
    данные.
servers:
  - url: http://localhost:33000
tags:
  - name: Настройки
    description: Дата расчёта.
  - name: Аккаунт
    description: Учётка вошедшего сотрудника.

paths:
  /api/v1/settings/calculation-date:
    get:
      tags: [Настройки]
      operationId: getCalculationDate
      summary: Получить дату расчёта
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Дата расчёта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationDate'
              examples:
                fixed:
                  summary: Зафиксирована (макет «Настройки — другое»)
                  value: { mode: fixed, fixedAt: '2026-10-19T15:00:00Z' }
                current:
                  summary: Текущая, раньше не фиксировали
                  value: { mode: current, fixedAt: null }
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [Настройки]
      operationId: saveCalculationDate
      summary: Сменить дату расчёта
      description: |
        Сохраняет режим и пересчитывает риски на новую дату. При `mode: current` фронт присылает
        последний `fixedAt` — сервер его хранит, чтобы «Зафиксировать» вернуло прежний момент.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculationDate'
      responses:
        '200':
          description: Сохранено и пересчитано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationDate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: '`mode: fixed` без `fixedAt`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/account/password:
    post:
      tags: [Аккаунт]
      operationId: changePassword
      summary: Сменить свой пароль
      description: |
        Меняет пароль вошедшего сотрудника. Текущая сессия остаётся; остальные refresh-токены
        сотрудника сервер отзывает — на других устройствах нужно войти заново.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Пароль изменён
        '400':
          description: 'Текущий пароль неверный — `error: INVALID_CURRENT_PASSWORD`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: 400
                error: INVALID_CURRENT_PASSWORD
                message: Неверный текущий пароль
                path: /api/v1/account/password
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: 'Новый пароль не по правилам — `error: WEAK_PASSWORD`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Access-токен отсутствует, истёк или некорректен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

  schemas:
    CalculationDate:
      type: object
      required: [mode, fixedAt]
      properties:
        mode:
          type: string
          enum: [current, fixed]
          description: current — «Текущая», fixed — «Зафиксировать».
        fixedAt:
          type: [string, 'null']
          format: date-time
          description: |
            Зафиксированный момент в UTC. При `mode: current` — последний зафиксированный,
            `null` — ни разу не фиксировали. При `mode: fixed` обязателен.
          example: '2026-10-19T15:00:00Z'

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 255
          description: От 8 символов, строчная и заглавная буквы и цифра.

    ApiErrorResponse:
      type: object
      description: Стандартный формат ошибки API (как в auth).
      properties:
        status:
          type: integer
          format: int32
        error:
          type: string
          example: INVALID_CURRENT_PASSWORD
        message:
          type: string
        path:
          type: string
        timestamp:
          type: string
          format: date-time
