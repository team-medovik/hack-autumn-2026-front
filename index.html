<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>аéza dashboard</title>

    <!-- Inter — шрифт дизайн-системы (Figma), см. --font-family в src/app/index.css -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,700;1,700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Тема до первой отрисовки — как в useTheme (ключ theme-store), чтобы прелоадер
      // и приложение не мигали светлым при тёмной теме и наоборот.
      (function () {
        var mode = 'system';
        try {
          mode = JSON.parse(localStorage.getItem('theme-store')).state.mode || mode;
        } catch (error) {}
        if (mode === 'system') {
          mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', mode);
      })();
    </script>

    <style>
      /* ─── App Preloader ──────────────────────────────────────────────────
         Пока грузится бандл. Убирается в main.tsx после монтирования React.
         Только CSS: работает, даже если бандл не загрузился.
         Цвета — токены дизайн-системы (bg/page, border/divider, text/*, accent/default),
         орбиты — как на экране входа, логотип — Logo из Figma.
      ──────────────────────────────────────────────────────────────────── */
      :root {
        --pre-bg: #f4f4f4;
        --pre-orbit: #e1e1e1;
        --pre-text: #0a0a0a;
        --pre-muted: #8e8e8e;
        --pre-accent: #18c9e1;
      }

      :root[data-theme='dark'] {
        --pre-bg: #000000;
        --pre-orbit: #2f2f2f;
        --pre-text: #ffffff;
        --pre-muted: #666666;
      }

      body {
        margin: 0;
        background: var(--pre-bg);
      }

      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        overflow: hidden;
        background: var(--pre-bg);
        font-family: 'Inter', system-ui, sans-serif;
        transition:
          opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          visibility 0.4s;
      }

      #app-preloader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Сцена: орбиты, по ним бегут точки, в центре логотип */
      .pre-stage {
        position: relative;
        display: grid;
        place-items: center;
        width: 240px;
        height: 240px;
        animation: pre-fade 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .pre-orbit {
        position: absolute;
        inset: 0;
        border: 1.5px dashed var(--pre-orbit);
        border-radius: 50%;
        animation: pre-spin 14s linear infinite;
      }

      .pre-orbit--inner {
        inset: 44px;
        animation-duration: 9s;
        animation-direction: reverse;
      }

      /* Точка на орбите */
      .pre-satellite {
        position: absolute;
        inset: 0;
        animation: pre-spin 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      .pre-satellite::before {
        content: '';
        position: absolute;
        top: -4px;
        left: 50%;
        width: 8px;
        height: 8px;
        margin-left: -4px;
        border-radius: 50%;
        background: var(--pre-accent);
        box-shadow: 0 0 12px var(--pre-accent);
      }

      .pre-satellite--inner {
        inset: 44px;
        animation-duration: 3.6s;
        animation-direction: reverse;
      }

      .pre-satellite--inner::before {
        top: -3px;
        width: 6px;
        height: 6px;
        margin-left: -3px;
        background: var(--pre-muted);
        box-shadow: none;
      }

      .pre-logo {
        width: 64px;
        height: 64px;
        animation: pre-breathe 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      .pre-logo__accent {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: pre-accent 2.4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }

      .pre-title {
        margin: 0;
        color: var(--pre-text);
        font-size: 32px;
        font-weight: 700;
        line-height: 40px;
        letter-spacing: -0.02em;
        animation: pre-fade 0.6s 0.1s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .pre-caption {
        margin: -24px 0 0;
        color: var(--pre-muted);
        font-size: 16px;
        line-height: 24px;
        animation: pre-fade 0.6s 0.2s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      /* Точки растут справа, пустое место того же размера слева — текст не ездит */
      .pre-caption::before,
      .pre-caption::after {
        content: '';
        display: inline-block;
        width: 1.2em;
      }

      .pre-caption::after {
        content: '';
        display: inline-block;
        width: 1.2em;
        text-align: left;
        animation: pre-dots 1.2s steps(4) infinite;
      }

      @keyframes pre-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pre-fade {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
      }

      @keyframes pre-breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.06);
        }
      }

      @keyframes pre-accent {
        0%,
        15% {
          opacity: 0;
          transform: translate(4px, -10px) rotate(-12deg);
        }
        40%,
        85% {
          opacity: 1;
          transform: none;
        }
        100% {
          opacity: 0;
          transform: none;
        }
      }

      @keyframes pre-dots {
        0% {
          content: '';
        }
        25% {
          content: '.';
        }
        50% {
          content: '..';
        }
        75% {
          content: '...';
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-preloader *,
        #app-preloader *::before,
        #app-preloader *::after {
          animation: none !important;
        }
      }

      @media (max-width: 427.98px) {
        .pre-title {
          font-size: 24px;
          line-height: 32px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Статичный прелоадер — убирается после монтирования React (см. main.tsx) -->
    <div id="app-preloader" role="status" aria-label="Загрузка админ-панели">

        </svg>
      </div>
      <p class="pre-title">админ-панéль</p>
      <p class="pre-caption">загружаем данные</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
